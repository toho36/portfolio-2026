<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Abstract volleyball event operations court">
  <style>
    .court { fill: none; stroke: #102044; stroke-width: 3 }
    .lane { fill: none; stroke: #1557ff; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 14 16 }
    .net { stroke: #ff5a24; stroke-width: 8; stroke-dasharray: 10 10 }
    .stop { fill: #f7f3e8; stroke: #1557ff; stroke-width: 4 }
    .ball-position { animation: rally 5.5s cubic-bezier(.65,0,.35,1) infinite }
    .ball { fill: #bce933; stroke: #102044; stroke-width: 5; transform-box: fill-box; transform-origin: center; animation: spin 5.5s linear infinite }
    .ping { fill: none; stroke: #ff5a24; stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: ping 2.2s ease-out infinite }
    @keyframes rally { 0%, 8% { transform: translate(-170px, 170px) } 30% { transform: translate(-55px, 55px) } 52% { transform: translate(55px, -55px) } 76%, 100% { transform: translate(170px, -170px) } }
    @keyframes spin { to { transform: rotate(390deg) } }
    @keyframes ping { 0% { opacity: .9; transform: scale(.35) } 75%, 100% { opacity: 0; transform: scale(1.45) } }
    @media (prefers-reduced-motion: reduce) { .ball-position, .ball, .ping { animation: none } .ball-position { transform: translate(170px, -170px) } .ping { opacity: 0 } }
  </style>
  <rect class="court" x="70" y="70" width="500" height="500"/>
  <path class="court" d="M320 70v500M70 320h500M195 70v500M445 70v500" opacity=".26"/>
  <path class="lane" d="M150 490L490 150"/>
  <path class="net" d="M88 320h464"/>
  <circle class="stop" cx="150" cy="490" r="15"/>
  <circle class="stop" cx="265" cy="375" r="15"/>
  <circle class="stop" cx="375" cy="265" r="15"/>
  <circle class="stop" cx="490" cy="150" r="15"/>
  <circle class="ping" cx="320" cy="320" r="44"/>
  <g class="ball-position"><g class="ball"><circle cx="320" cy="320" r="30"/><path class="court" d="M298 320h44M320 298v44"/></g></g>
</svg>
